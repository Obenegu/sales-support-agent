services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=tabot
      - POSTGRES_PASSWORD=***
      - POSTGRES_DB=agent_memory
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabot -d agent_memory"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - genuka-network

  redis:
    image: redis:latest
    volumes:
      - redisdata:/data
    networks:
      - genuka-network

  orchestrator:
    build:
      context: .
      dockerfile: ./orchestrator/Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    networks:
      - genuka-network

  backend:
    build:
      context: ./backend/SalesSupportBackend
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=agent_memory;Username=tabot;Password=***
      - ORCHESTRATOR_URL=http://orchestrator:8000
    ports:
      - "5132:5132"
    depends_on:
      db:
        condition: service_healthy
      orchestrator:
        condition: service_started
    networks:
      - genuka-network

  frontend:
    build:
      context: ./chat-widget
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://backend:5132
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - genuka-network

volumes:
  pgdata:
  redisdata:

networks:
  genuka-network:
    driver: bridge
